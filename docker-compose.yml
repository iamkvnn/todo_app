services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-todo}
      MYSQL_USER: ${DB_USERNAME:-todo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-todo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  todo-api:
    build:
      context: ./todo
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-todo}
      DB_USERNAME: ${DB_USERNAME:-todo}
      DB_PASSWORD: ${DB_PASSWORD:-todo}
    ports:
      - "8080:8080"

  todo-fe:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - todo-api
    ports:
      - "5173:80"

volumes:
  mysql-data:
